services:
  - type: web
    name: crossword-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FIRESTORE_PROJECT_ID
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
